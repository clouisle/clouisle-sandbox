# Control plane storage: PostgreSQL StatefulSet
#
# apiserver 多副本共享此状态源（HA 前提）。

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: clouisle
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: clouisle
            - name: POSTGRES_PASSWORD
              value: changeme
            - name: POSTGRES_DB
              value: clouisle
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "clouisle"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: clouisle
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432