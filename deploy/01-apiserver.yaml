# Control plane: all-in-one apiserver Deployment + Service
#
# 默认 Pod 直接拥有本节点 Firecracker、镜像缓存和网络隔离；多节点 profile
# 通过 Kustomize patch 显式切换到 ScheduledNodeVmm。
## PostgreSQL 是共享的唯一外部状态依赖。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
  namespace: clouisle
spec:
  replicas: 1
  selector:
    matchLabels: { app: apiserver }
  template:
    metadata:
      labels: { app: apiserver }
    spec:
      serviceAccountName: apiserver
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: apiserver
          image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-sandbox:v0.1.5
          args:
            - --addr=0.0.0.0:8080
            - --db=$(POSTGRES_DSN)
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: clouisle-db
                  key: dsn
            - name: CLOUISLE_WARM_POOL_MIN_IDLE
              value: "0"
            - name: CLOUISLE_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: clouisle-api-keys
                  key: keys
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
            - name: vmlinux
              mountPath: /opt/clouisle/vmlinux
              readOnly: true
            - name: rootfs
              mountPath: /opt/clouisle/rootfs
              readOnly: true
            - name: image-cache
              mountPath: /opt/clouisle/images
            - name: firecracker
              mountPath: /run/clouisle
            - name: control-plane-data
              mountPath: /data
          ports:
            - containerPort: 8080
          # 优雅关闭：SIGTERM → /health/ready 返回 503 → LB 摘流 → 等 30s → 退出
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN", "SYS_PTRACE"]
      volumes:
        - name: kvm
          hostPath: { path: /dev/kvm }
        - name: vmlinux
          hostPath:
            path: /opt/clouisle/vmlinux
            type: File
        - name: rootfs
          hostPath:
            path: /opt/clouisle/rootfs
            type: Directory
        - name: image-cache
          hostPath:
            path: /opt/clouisle/images
            type: DirectoryOrCreate
        - name: firecracker
          hostPath:
            path: /run/clouisle
            type: DirectoryOrCreate
        - name: control-plane-data
          hostPath:
            path: /var/lib/clouisle/control-plane
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: apiserver
  namespace: clouisle
spec:
  selector: { app: apiserver }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: clouisle-db
  namespace: clouisle
type: Opaque
stringData:
  dsn: "postgres://clouisle:changeme@postgres:5432/clouisle"
---
apiVersion: v1
kind: Secret
metadata:
  name: clouisle-api-keys
  namespace: clouisle
type: Opaque
stringData:
  # Replace before deployment. Format: key:tenant:read|full, comma-separated.
  keys: "replace-before-deploy:default:full"
  # Raw full-scope key consumed by the optional clouisled profile.
  node-key: "replace-before-deploy"