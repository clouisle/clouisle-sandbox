# Control plane: apiserver Deployment + Service
#
# 无状态：不持有 VMM 引用，通过 gRPC 转发到 clouisled。
# 通过 PostgreSQL 共享状态（HA 前提）。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
  namespace: clouisle
spec:
  replicas: 2
  selector:
    matchLabels: { app: apiserver }
  template:
    metadata:
      labels: { app: apiserver }
    spec:
      serviceAccountName: apiserver
      automountServiceAccountToken: false
      containers:
        - name: apiserver
          image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-sandbox:v0.1.5
          args:
            - --addr=0.0.0.0:8080
            - --db=$(POSTGRES_DSN)
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: clouisle-db
                  key: dsn
            - name: CLOUISLE_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: clouisle-api-keys
                  key: keys
          ports:
            - containerPort: 8080
          # 优雅关闭：SIGTERM → /health/ready 返回 503 → LB 摘流 → 等 30s → 退出
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: apiserver
  namespace: clouisle
spec:
  selector: { app: apiserver }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: clouisle-db
  namespace: clouisle
type: Opaque
stringData:
  dsn: "postgres://clouisle:changeme@postgres:5432/clouisle"
---
apiVersion: v1
kind: Secret
metadata:
  name: clouisle-api-keys
  namespace: clouisle
type: Opaque
stringData:
  # Replace before deployment. Format: key:tenant:read|full, comma-separated.
  keys: "replace-before-deploy:default:full"