
x-firecracker-volumes:
  kvm: &fc-kvm /dev/kvm:/dev/kvm
  kernel: &fc-kernel /opt/clouisle/vmlinux:/opt/clouisle/vmlinux:ro
  rootfs: &fc-rootfs /opt/clouisle/rootfs:/opt/clouisle/rootfs:ro
  image-cache: &fc-image-cache /opt/clouisle/images:/opt/clouisle/images

services:
  # ============ 控制平面：apiserver ============
  apiserver:
    image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-sandbox:v0.1.5
    container_name: clouisle-apiserver
    privileged: true                        # 访问 /dev/kvm + 创建 netns
    network_mode: host                      # netns / nftables 需要宿主网络
    environment:
      - RUST_LOG=info
      - CLOUISLE_API_KEYS=local-development-key:local:full
    # 用 postgres 连接串（HA 就绪）
    command:
      - --addr=0.0.0.0:8080
      - --db=postgres://clouisle:changeme@127.0.0.1:5432/clouisle
    volumes:
      - *fc-kvm
      - *fc-kernel
      - *fc-rootfs
      - *fc-image-cache
      - clouisle-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============ 数据平面：clouisled ==========
  clouisled:
    image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-sandbox:v0.1.5
    container_name: clouisle-node
    entrypoint: ["clouisled"]
    command:
      - --addr=0.0.0.0:9090
      - --db=/data/clouisled.db
      - --node-id=local
    privileged: true
    network_mode: host
    environment:
      - RUST_LOG=info
    volumes:
      - *fc-kvm
      - *fc-kernel
      - *fc-rootfs
      - *fc-image-cache
      - clouisled-data:/data
    restart: unless-stopped


  # ============ 存储：PostgreSQL（HA 就绪） ============
  postgres:
    image: postgres:16-alpine
    container_name: clouisle-postgres
    network_mode: host
    environment:
      - POSTGRES_USER=clouisle
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=clouisle
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouisle"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  clouisled-data:
    driver: local
  clouisle-data:
    driver: local
  pg-data:
    driver: local