[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "clouisle-sandbox"
version = "0.1.0"
description = "Clouisle Sandbox Python SDK"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/clouisle/clouisle-sandbox"