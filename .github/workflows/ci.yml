# Clouisle Sandbox CI
#
# 注意：GitHub Actions runner 无 /dev/kvm，不运行测试。
# 需要 KVM 的端到端测试在自托管 runner 上执行。
#
# 触发条件：push / pull request 到 main 分支

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the established required-check name, but formatting needs no dependency build.
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check --all

  # Clippy and build share one runner and one target directory.
  build-linux:
    name: Build (Linux amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-amd64
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler pkg-config libssl-dev
      - name: Clippy (Linux)
        run: cargo clippy --workspace --features test-utils --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked

  # macOS is a portability check; deployable runtime binaries are Linux containers.
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64
      - name: Install protoc
        run: |
          brew untap aws/tap || true
          brew install protobuf
      - name: Check
        run: cargo check --workspace --locked