# Clouisle Sandbox CI
#
# 注意：GitHub Actions runner 无 /dev/kvm，不运行测试。
# 需要 KVM 的端到端测试在自托管 runner 上执行。
#
# 触发条件：push / pull request 到 main 分支

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ 代码质量检查 ============
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler pkg-config libssl-dev
      - name: Format check
        run: cargo fmt --check --all
      - name: Clippy (Linux)
        run: cargo clippy --workspace -- -D warnings

  # ============ 编译检查（Linux amd64） ============
  build-linux:
    name: Build (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler pkg-config libssl-dev
      - name: Build
        run: cargo build --workspace

  # ============ 编译检查（macOS arm64） ============
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install protoc
        run: brew install protobuf
      - name: Build
        run: cargo build --workspace