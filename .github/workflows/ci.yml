# Clouisle Sandbox CI
#
# 注意：GitHub Actions runner 无 /dev/kvm，不运行测试。
# 需要 KVM 的端到端测试在自托管 runner 上执行。
#
# 触发条件：push / pull request 到 main 分支

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the established required-check name, but formatting needs no dependency build.
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check --all

  # Clippy and build share one runner and one target directory.
  build-linux:
    name: Build (Linux amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-amd64
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler pkg-config libssl-dev
      - name: Clippy (Linux)
        run: cargo clippy --workspace --features test-utils --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked

  # macOS is a portability check; deployable runtime binaries are Linux containers.
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64
      - name: Install protoc
        run: |
          brew untap aws/tap || true
          brew install protobuf
      - name: Check
        run: cargo check --workspace --locked
  # Rust test gates. Unit + integration suites must stay green.
  test:
    name: Test (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-amd64
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler pkg-config libssl-dev
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Feature-gated API suites
        run: cargo test -p clouisle-api --features test-utils --tests --locked

  # SDK client tests (fake HTTP servers; no KVM needed).
  sdk-test:
    name: Test (SDKs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: astral-sh/setup-uv@v4
      - name: TypeScript SDK tests
        working-directory: sdk/typescript
        run: |
          npm install
          npm test
      - name: Python SDK tests
        working-directory: sdk/python
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          .venv/bin/python -m pytest tests -q

  # Line-coverage gates for non-KVM business logic. Firecracker/network/agent
  # code requires /dev/kvm and is intentionally not gated here; thresholds are
  # stepped up toward 80% as coverage lands. Current local values are in the
  # per-step comments.
  coverage:
    name: Coverage (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-amd64
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler pkg-config libssl-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      # clouisle-core: 82% locally.
      - name: Coverage clouisle-core
        run: cargo llvm-cov -p clouisle-core --fail-under-lines 80 --locked
      # clouisle-store: 58% locally.
      - name: Coverage clouisle-store
        run: cargo llvm-cov -p clouisle-store --fail-under-lines 55 --locked
      # clouisle-api incl. feature-gated suites: 63% locally.
      - name: Coverage clouisle-api
        run: cargo llvm-cov -p clouisle-api --features test-utils --tests --fail-under-lines 60 --locked

  # Dependency vulnerability scan (RustSec advisory database).
  audit:
    name: Audit (cargo audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
