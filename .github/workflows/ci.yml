# Clouisle Sandbox CI
#
# 注意：GitHub Actions runner 无 /dev/kvm，不运行测试。
# 需要 KVM 的端到端测试在自托管 runner 上执行。
#
# 触发条件：push / pull request 到 main 分支

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ 代码质量检查 ============
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler pkg-config libssl-dev
      - name: Format check
        run: cargo fmt --check --all
      - name: Clippy (Linux)
        run: cargo clippy --workspace -- -D warnings

  # ============ 编译检查（Linux amd64） ============
  build-linux:
    name: Build (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler pkg-config libssl-dev
      - name: Build
        run: cargo build --workspace

  # ============ 编译检查（macOS arm64） ============
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install protoc
        run: brew install protobuf
      - name: Build
        run: cargo build --workspace

  # ============ Docker 多平台镜像构建 ============
  docker:
    name: Build Docker image (multi-arch)
    runs-on: ubuntu-latest
    needs: [lint, build-linux, build-macos]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.cn-shanghai.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/clouisle-sandbox:latest
            registry.cn-shanghai.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/clouisle-sandbox:${{ github.sha }}