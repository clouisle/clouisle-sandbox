# Release workflow
#
# Triggered by v* tags. The versioned OCI image is the only runtime artifact.
# GitHub-hosted runners have no KVM, so this workflow does not run KVM tests.


name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # ============ Docker 多平台镜像 ============
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.cn-shanghai.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/clouisle-sandbox:latest
            registry.cn-shanghai.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/clouisle-sandbox:${{ github.ref_name }}

      # ============ GitHub Release ============
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }}
          body: |
            ## Clouisle Sandbox ${{ github.ref_name }}

            Runtime is delivered only as a multi-architecture OCI image:
            `registry.cn-shanghai.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/clouisle-sandbox:${{ github.ref_name }}`.

            Deploy with Docker Compose or Kubernetes on a Linux host with `/dev/kvm`.
            Native runtime binaries and archives are intentionally not published.